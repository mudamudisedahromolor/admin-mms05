<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal Admin - BPH MMS 05</title>
    
    <link rel="icon" href="images/mms.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <header class="site-header">
        <div class="header-logo-area">
            <div class="logo-wrapper">
                <img src="images/mms.png" alt="Logo MMS" class="mini-logo">
                <div class="header-text">
                    <span class="brand-title">BADAN PENGURUS HARIAN</span>
                    <span class="brand-subtitle">MUDA MUDI SEDAHROMO LOR 05</span>
                </div>
            </div>
        </div>
        <div class="header-secure-badge">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
    </header>

    <div class="login-page-wrapper">
        <div class="login-content-box">
            <h3 class="box-title">PORTAL UTAMA ADMIN</h3>
            <hr class="box-divider">
            <p class="box-subtitle">Silakan masukkan kode akses khusus pengurus untuk masuk ke sistem administrasi data.<br>  </p>
            
   <div class="input-wrapper">
      <i class="fa-solid fa-lock"></i>
         <input type="password" id="access-code" class="login-input" placeholder="Masukkan Password...">
            </div>
            <div id="error-message" class="error-text"></div>

<button onclick="validasiLogin()" class="btn-login">
    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
</button>
            
        </div>
    </div>

    <footer class="portal-footer">
        <p>&copy; 2026 Admin Panel Muda Mudi Sedahromo Lor 05.</p>
    </footer>

    <div id="pwa-install-popup" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background-color: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border-radius: 12px; padding: 16px; z-index: 999999; font-family: sans-serif; border-left: 5px solid #E53935;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
        <img src="images/mms.png" alt="Logo MMS" style="width: 45px; height: 45px; border-radius: 8px;">
        <div>
            <h4 style="margin: 0; color: #333; font-size: 15px;">Aplikasi MMS 05</h4>
            <p style="margin: 2px 0 0 0; color: #666; font-size: 12px;">Tambahkan ke layar utama HP agar akses lebih cepat</p>
        </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="tutupPopupInstal()" style="background: none; border: none; color: #888; font-weight: bold; cursor: pointer; padding: 8px 12px; font-size: 13px;">Nanti Saja</button>
        <button id="btn-instal-pwa" style="background-color: #E53935; border: none; color: white; font-weight: bold; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; box-shadow: 0 2px 5px rgba(229,57,53,0.3);">Instal Sekarang</button>
    </div>
</div>

    <script src="script.js"></script> 
</body>
</html>
