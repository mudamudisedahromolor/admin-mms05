    <style>
        .bracket-scroll-container { width: 100%; overflow-x: auto; padding: 20px 0; margin-top: 20px; }
        .bracket-wrapper { display: flex; gap: 40px; align-items: center; min-width: max-content; padding: 10px; }
        .bracket-round { display: flex; flex-direction: column; gap: 20px; justify-content: center; min-width: 220px; }
        .bracket-match { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); overflow: hidden; position: relative; padding-top: 15px; }
        .bracket-match-id { position: absolute; top: 2px; left: 6px; font-size: 9px; font-weight: bold; color: #888; text-transform: uppercase; }
        .bracket-team-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
        .bracket-team-row:last-child { border-bottom: none; }
        .bracket-team-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .bracket-team-score { font-weight: bold; color: #666; background: #eaedf1; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .team-menang { background-color: #e8f5e9; }
        .team-menang .bracket-team-name { color: #2e7d32; font-weight: bold; }
        .team-menang .bracket-team-score { background: #2e7d32; color: white; }
        .danger-zone-box { margin-top: 40px; padding: 20px; border: 2px dashed #e53935; border-radius: 8px; background-color: #fff5f5; }
        .danger-title { color: #c62828; font-weight: bold; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .btn-reset-robot { background-color: #e53935 !important; box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3); }
        .btn-reset-robot:hover { background-color: #c62828 !important; }
        
        /* Style Tambahan Box Google Form */
        .gform-section-box { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .gform-title { font-size: 16px; font-weight: bold; color: #1a237e; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .gform-iframe-wrapper { position: relative; width: 100%; height: 480px; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; margin-top: 12px; }
