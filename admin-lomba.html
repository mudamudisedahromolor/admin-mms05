<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Turnamen - MMS 05</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e2e8f0; margin: 0; padding: 40px 20px; }
        .admin-box { background: #1e1e1e; max-width: 650px; margin: 0 auto; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #deff9a; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 24px; }
        label { display: block; font-size: 13px; font-weight: bold; margin: 15px 0 5px; color: #a0aec0; text-transform: uppercase; }
        select { width: 100%; height: 42px; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 0 10px; font-size: 15px; outline: none; }
        select:focus { border-color: #deff9a; }
        .btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; transition: 0.2s; }
        .btn-acak { background: #deff9a; color: #121212; }
        .btn-acak:hover { background: #c5f07b; }
        .btn-reset { background: #e53e3e; color: #fff; margin-top: 35px; background-image: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.15)); }
        .btn-reset:hover { background: #c53030; }
        .status-text { text-align: center; margin-top: 15px; font-size: 14px; font-weight: 500; min-height: 20px; }
        .danger-zone { border-top: 2px dashed #333; margin-top: 30px; padding-top: 10px; }
        .danger-title { color: #e53e3e; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2><i class="fa-solid fa-gear"></i> PANEL KENDALI DATA ROBOT</h2>
        
        <label>1. Rentang Usia</label>
        <select id="filter-usia">
            <option value="Kelas 1 - 3 SD">Kelas 1 - 3 SD</option>
            <option value="Kelas 4 SD - SMP">Kelas 4 SD - SMP</option>
            <option value="Dewasa">Dewasa / Umum</option>
        </select>

        <label>2. Jenis Kelamin</label>
        <select id="filter-gender">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>

        <label>3. Kategori Pertandingan</label>
        <select id="filter-kategori">
            <option value="Individu">Individu</option>
            <option value="Kelompok">Kelompok</option>
        </select>

        <button class="btn btn-acak" onclick="eksekusiAcakBagan()">
            <i class="fa-solid fa-shuffle"></i> KUNCI & ACAK BAGAN
        </button>

        <div id="status-display" class="status-text"></div>

        <div class="danger-zone">
            <div class="danger-title"><i class="fa-solid fa-triangle-exclamation"></i> DANGER ZONE</div>
            <p style="font-size: 13px; color: #a0aec0; margin: 0 0 10px 0;">Tombol di bawah akan menghapus seluruh data sementara pada tab Pendaftaran dan Bagan agar robot siap digunakan dari nol kembali.</p>
            <button class="btn btn-reset" onclick="eksekusiResetRobot()">
                <i class="fa-solid fa-trash-can"></i> TOGGLE RESET ROBOT
            </button>
        </div>
    </div>

    <script>
        // ====================================================================
        // CONFIG: TEMPELKAN URL GOOGLE APPS SCRIPT ANDA YANG BARU DI SINI
        // ====================================================================
        const URL_WEB_APP = "PASTE_URL_WEB_APP_ANDA_DI_SINI";

        // Fungsi pemicu pengacakan bagan (doPost)
        function eksekusiAcakBagan() {
            const usia = document.getElementById('filter-usia').value;
            const gender = document.getElementById('filter-gender').value;
            const kategori = document.getElementById('filter-kategori').value;

            const bodiPesan = {
                aksi: "generateBagan",
                targetUsia: usia,
                targetGender: gender,
                targetKategori: kategori
            };

            updateStatus("Sedahromo Engine sedang mengacak data...", "#deff9a");

            fetch(URL_WEB_APP, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(bodiPesan)
            })
            .then(res => res.json())
            .then(respon => {
                alert(respon.pesan);
                updateStatus(respon.pesan, respon.status === "sukses" ? "#48bb78" : "#f56565");
            })
            .catch(err => {
                console.error(err);
                updateStatus("Proses selesai. Silakan periksa tab Bagan di Google Sheets.", "#48bb78");
            });
        }

        // Fungsi pemicu reset sistem (doPost)
        function eksekusiResetRobot() {
            const konfirmasiKetat = confirm("PERINGATAN KERAS!\nTindakan ini akan mengosongkan isi Spreadsheet Robot.\nPastikan data pendaftaran ini sudah di-backup atau diarsip ke database utama.\n\nApakah Anda benar-benar ingin mereset?");
            
            if (!konfirmasiKetat) return;

            updateStatus("Sedang membersihkan seluruh sel robot...", "#e53e3e");

            fetch(URL_WEB_APP, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ aksi: "resetSystem" })
            })
            .then(res => res.json())
            .then(respon => {
                alert(respon.pesan);
                updateStatus(respon.pesan, "#48bb78");
            })
            .catch(err => {
                console.error(err);
                updateStatus("Sistem robot berhasil direset!", "#48bb78");
            });
        }

        // Helper update text status di layar
        function updateStatus(teks, warna) {
            const display = document.getElementById('status-display');
            display.innerText = teks;
            display.style.color = warna;
        }
    </script>
</body>
</html>
