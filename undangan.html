<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin Eksternal - Broadcast MMS 05</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 30px 15px; }
    .container { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 5px solid #D32F2F; }
    .header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .header h1 { color: #D32F2F; font-size: 1.8rem; margin-bottom: 5px; }
    .header p { color: #666; font-size: 0.95rem; }
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: 0.95rem; }
    .form-group label i { margin-right: 6px; color: #D32F2F; }
    input[type="text"], textarea { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; transition: all 0.3s ease; background-color: #fafafa; }
    input[type="text"]:focus, textarea :focus { border-color: #D32F2F; background-color: #fff; box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1); outline: none; }
    textarea { resize: vertical; min-height: 180px; font-family: inherit; line-height: 1.5; }
    .btn-kirim { display: block; width: 100%; background: #D32F2F; color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; text-align: center; }
    .btn-kirim:hover { background: #b71c1c; }
    .btn-kirim:disabled { background: #999; cursor: not-allowed; }
    #status-notif { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: 600; text-align: center; display: none; }
    .sukses { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .gagal { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .loading { background-color: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
    .tips { background: #fff8e1; border-left: 4px solid #ffb300; padding: 12px; margin-bottom: 25px; border-radius: 0 4px 4px 0; font-size: 0.88rem; color: #b78103; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="fa-solid fa-paper-plane"></i> Broadcast Undangan Rapat</h1>
    <p>Panel Admin Eksternal - Muda Mudi Sedahromo Lor 05</p>
  </div>

  <div class="tips">
    <strong><i class="fa-solid fa-lightbulb"></i> Info Eksternal:</strong> File HTML ini berjalan mandiri di luar Apps Script dan menembak data langsung ke server Google secara aman.
  </div>

  <div class="form-group">
    <label for="subjek"><i class="fa-solid fa-envelope-open-text"></i> Perihal / Subjek Email</label>
    <input type="text" id="subjek" placeholder="Contoh: Undangan Pertemuan Rutin Bulanan Karang Taruna">
  </div>

  <div class="form-group">
    <label for="pesan"><i class="fa-solid fa-file-lines"></i> Inti Isi Surat / Pengumuman</label>
    <textarea id="pesan" placeholder="Tulis rincian acara di sini...&#10;Hari: ...&#10;Jam: ...&#10;Tempat: ..."></textarea>
  </div>

  <button class="btn-kirim" id="btnSend" onclick="kirimEmailEksternal()"><i class="fa-solid fa-share-from-square"></i> Kirim Undangan Massal</button>

  <div id="status-notif"></div>
</div>

<script>
  function kirimEmailEksternal() {
    // ⚠️ MASUKKAN URL WEB APP GOOGLE APPS SCRIPT HASIL NEW DEPLOYMENT KAMU DI SINI
    const API_URL_MMS = "https://script.google.com/macros/s/AKfycbwJsN2EjXYhQgF8lyS574CtQoH5NpAJ65kQm7e9UdAwdqSwuYaSShPsWsjC8e1z85zQ/exec";

    var subjek = document.getElementById("subjek").value.trim();
    var pesan = document.getElementById("pesan").value.trim();
    var btn = document.getElementById("btnSend");
    var notif = document.getElementById("status-notif");
    
    if (subjek === "" || pesan === "") {
      alert("Harap isi Subjek dan Isi Pesan terlebih dadaulu!");
      return;
    }
    
    if (!confirm("Konfirmasi: Kirim email undangan massal ke seluruh anggota?")) {
      return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses Pengiriman...';
    notif.className = "loading";
    notif.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menghubungi server Google dan menyebarkan email email undangan...';
    notif.style.display = "block";

    // Menyusun payload data kiriman berbentuk JSON POST
    let payload = {
      aksi: "broadcastEmail",
      subjek: subjek,
      pesan: pesan
    };

    // Melakukan eksekusi tembakan HTTP POST API murni bebas hambatan cors
    fetch(API_URL_MMS, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(res => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-share-from-square"></i> Kirim Undangan Massal';
      
      if(res.status === 'success') {
        notif.className = "sukses";
        notif.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + res.message;
        document.getElementById("subjek").value = "";
        document.getElementById("pesan").value = "";
      } else {
        notif.className = "gagal";
        notif.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gagal: ' + res.message;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-share-from-square"></i> Kirim Undangan Massal';
      notif.className = "gagal";
      notif.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Terjadi gangguan koneksi internet atau URL API salah.';
    });
  }
</script>

</body>
</html>
